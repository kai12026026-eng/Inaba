<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI食事診断コンパス</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div class="brand-wrap">
          <div class="brand-mark">
            <span class="leaf leaf-1"></span>
            <span class="leaf leaf-2"></span>
            <span class="leaf leaf-3"></span>
            <span class="leaf leaf-4"></span>
          </div>
          <div class="brand-text">
            <span>AI食事診断</span>
            <strong>コンパス</strong>
          </div>
        </div>
      </header>

      <main class="main-content">
        <h1>食事を撮るだけ！ AIがあなたの食生活をサポート</h1>

        <section class="flow">
          <article class="step-card phone-card">
            <div class="phone-frame">
              <div class="phone-notch"></div>
              <div class="phone-screen">
                <div class="meal-photo" id="mealPreview">
                  <div class="meal-art">
                    <div class="bowl bowl-main"></div>
                    <div class="bowl bowl-side"></div>
                    <div class="dish dish-1"></div>
                    <div class="dish dish-2"></div>
                    <div class="dish dish-3"></div>
                    <div class="dish dish-4"></div>
                    <div class="dish dish-5"></div>
                  </div>
                </div>
                <div class="capture-underlay"></div>
                <div class="capture-label">AIが解析中...</div>
                <label class="camera-btn" for="photoInput" aria-label="写真を選択">
                  <span>◉</span>
                </label>
                <input id="photoInput" type="file" accept="image/*" capture="environment" />
              </div>
            </div>
          </article>

          <div class="arrow">→</div>

          <article class="step-card analysis-card">
            <div class="analysis-visual">
              <div class="ai-face">
                <div class="ai-head">
                  <span class="eye left"></span>
                  <span class="eye right"></span>
                  <span class="mouth"></span>
                </div>
                <div class="ai-body"></div>
              </div>
              <div class="magnifier">
                <div class="circle"></div>
                <div class="handle"></div>
              </div>
              <div class="bars">
                <span style="height: 52%"></span>
                <span style="height: 68%"></span>
                <span style="height: 82%"></span>
                <span style="height: 61%"></span>
                <span style="height: 90%"></span>
              </div>
            </div>
            <div class="analysis-box">
              <div class="tag">本日の食事分析結果（夕食）</div>
              <div class="calorie-row">
                <span>推定カロリー：</span>
                <strong>650 kcal</strong>
              </div>
              <div class="pfc-row">
                <div class="pfc-item protein">
                  <span>P</span>
                  <strong>30%</strong>
                </div>
                <div class="pfc-item fat">
                  <span>F</span>
                  <strong>50%</strong>
                </div>
                <div class="pfc-item carb">
                  <span>C</span>
                  <strong>70%</strong>
                </div>
              </div>
              <div class="radar-box">
                <div class="radar-chart">
                  <span class="dot dot-a"></span>
                  <span class="dot dot-b"></span>
                  <span class="dot dot-c"></span>
                  <span class="dot dot-d"></span>
                  <span class="dot dot-e"></span>
                </div>
                <div class="legend">
                  <div><span class="key key-green"></span>たんぱく質</div>
                  <div><span class="key key-orange"></span>食物繊維</div>
                  <div><span class="key key-yellow"></span>塩分</div>
                  <div><span class="key key-purple"></span>鉄分</div>
                </div>
              </div>
            </div>
          </article>

          <div class="arrow">→</div>

          <article class="step-card advice-card">
            <div class="advice-portrait">
              <div class="portrait-ring"></div>
              <div class="portrait-face">
                <span class="head"></span>
                <span class="hair"></span>
                <span class="smile"></span>
              </div>
            </div>
            <div class="bubble">
              素晴らしいバランスです！<br />
              でも、ビタミンAが少し足り
              ません。<br />
              タンパク質はほうれん草の和え物を<br />
              プラスしてみましょう！<br />
              明日も頑張りましょう！
            </div>
            <div class="menu-bar">
              <button class="tab active">ホーム</button>
              <button class="tab">履歴</button>
              <button class="tab">アドバイス</button>
              <button class="tab">設定</button>
            </div>
          </article>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
